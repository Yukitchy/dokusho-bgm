<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>読書BGM</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#000;--sub:#8e8e93;--tint:#007aff;--sep:#c6c6c8}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--label:#fff;--sep:#38383a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:34px;font-weight:700;margin:24px 0 4px}
.sub{color:var(--sub);font-size:15px;margin:0 0 16px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}
video{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover;display:block}
button{font:inherit;font-weight:600;min-height:50px;width:100%;border:0;border-radius:12px;background:var(--tint);color:#fff;margin-top:12px}
button.g{background:var(--bg);color:var(--tint)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:.5px solid var(--sep)}
.row:last-child{border:0}.row span:last-child{color:var(--sub)}
#mood{font-size:28px;font-weight:700}
.on{color:var(--tint)}
</style>
</head>
<body>
<h1>読書BGM</h1>
<p class="sub">本が見える向きにスタンドで立ててください。ページをめくると場面に合う曲に変わります。</p>
<div class="card">
  <video id="v" playsinline muted></video>
  <button id="go">はじめる</button>
  <button id="flip" class="g">ページをめくった（手動テスト）</button>
</div>
<div class="card">
  <div class="row"><span>いまの気分</span><span id="mood">—</span></div>
  <div class="row"><span>判定候補</span><span id="cand">—</span></div>
  <div class="row"><span>画面の変化量</span><span id="diff">—</span></div>
  <div class="row"><span>めくり検知</span><span id="turns">0回</span></div>
</div>
<script>
// ponytail: 気分判定はダミー(乱択)。本物はここをHaiku呼び出しに差し替える
const MOODS={
 穏やか:{f:[261.6,329.6,392],t:'sine'}, 日常:{f:[293.7,370,440],t:'triangle'},
 楽しい:{f:[392,493.9,587.3],t:'triangle'}, ワクワク:{f:[329.6,415.3,493.9],t:'sawtooth'},
 緊張:{f:[220,261.6,311.1],t:'sawtooth'}, 不穏:{f:[196,233.1,277.2],t:'square'},
 恐怖:{f:[110,116.5,164.8],t:'sawtooth'}, 悲しい:{f:[220,261.6,329.6],t:'sine'},
 切ない:{f:[246.9,293.7,370],t:'sine'}, 戦い:{f:[146.8,174.6,220],t:'sawtooth'},
 神秘:{f:[349.2,440,523.3],t:'sine'}, 余韻:{f:[174.6,220,261.6],t:'sine'}};
const NAMES=Object.keys(MOODS),FADE=3,THRESH=12,$=id=>document.getElementById(id);
let ac,cur=null,curName=null,last=null,prev=null,turns=0;

function voice(m){ // 1気分=3音のループパッド。ゲイン1本で出し入れ
  const g=ac.createGain();g.gain.value=0;g.connect(ac.destination);
  const oscs=m.f.map(f=>{const o=ac.createOscillator(),lp=ac.createBiquadFilter();
    o.type=m.t;o.frequency.value=f;lp.frequency.value=900;o.connect(lp).connect(g);o.start();return o});
  return{g,stop:()=>oscs.forEach(o=>o.stop())};
}
function crossfade(name){
  if(name===curName)return;
  const t=ac.currentTime,nv=voice(MOODS[name]);
  nv.g.gain.linearRampToValueAtTime(0.06,t+FADE);
  if(cur){const o=cur;o.g.gain.cancelScheduledValues(t);o.g.gain.setValueAtTime(o.g.gain.value,t);
    o.g.gain.linearRampToValueAtTime(0,t+FADE);setTimeout(()=>o.stop(),FADE*1000+200)}
  cur=nv;curName=name;$('mood').textContent=name;
}
function onTurn(){
  turns++;$('turns').textContent=turns+'回';
  const c=NAMES[Math.random()*NAMES.length|0];
  $('cand').textContent=c+(c===last?'（2回連続→切替）':'');
  if(c===last)crossfade(c); // 同じ気分が2回続いたら切替
  last=c;
}
function sample(v,cv){ // 32x24グレースケール。前回との平均絶対差が閾値超ならめくり
  const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,32,24);
  const d=x.getImageData(0,0,32,24).data,a=[];
  for(let i=0;i<d.length;i+=4)a.push((d[i]+d[i+1]+d[i+2])/3);
  if(prev){let s=0;for(let i=0;i<a.length;i++)s+=Math.abs(a[i]-prev[i]);s/=a.length;
    $('diff').textContent=s.toFixed(1);if(s>THRESH)onTurn()}
  prev=a;
}
$('flip').onclick=()=>{ac&&onTurn()};
$('go').onclick=async()=>{
  ac=ac||new AudioContext();await ac.resume();
  const v=$('v'),cv=document.createElement('canvas');cv.width=32;cv.height=24;
  try{v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});await v.play();
    setInterval(()=>sample(v,cv),2000)}
  catch(e){$('diff').textContent='カメラ不可: '+e.name}
  crossfade('穏やか');$('go').hidden=true;
};
</script>
</body>
</html>
